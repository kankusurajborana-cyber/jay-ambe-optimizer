<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAY AMBE PROFILE - Auto Optimizer (AI Edition)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a; --surface: #1e293b; --surface-card: #0f172a;
            --text-main: #f8fafc; --text-muted: #94a3b8; --border: #334155;
            --header-bg: #020617; --header-text: #f8fafc; --cat-bg: #2d2d2d;
            --cat-text: #fbbf24; --btn-bg: #3b82f6; --btn-text: #ffffff;
            --red-btn: #ef4444; --waste: #ef4444; --profile: #38bdf8;
            --handle: #34d399; --summary-bg: #020617; --summary-card: #1e293b;
            --accent: #f59e0b; --ai-btn: #10b981;
        }
        .light-mode {
            --bg-color: #f8fafc; --surface: #ffffff; --surface-card: #f1f5f9;
            --text-main: #0f172a; --text-muted: #64748b; --border: #cbd5e1;
            --header-bg: #1e293b; --header-text: #f8fafc; --cat-bg: #f1f5f9;
            --cat-text: #b45309; --btn-bg: #2563eb; --btn-text: #ffffff;
            --red-btn: #ef4444; --waste: #ef4444; --profile: #2563eb;
            --handle: #059669; --summary-bg: #0f172a; --summary-card: #1e293b;
            --ai-btn: #059669;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 8px; font-size: 12px; transition: background 0.2s, color 0.2s; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; }
        h1 { font-size: 16px; margin: 0; font-weight: 700; color: var(--text-main); text-align: center; flex: 1; }
        .controls { display: flex; gap: 6px; align-items: center; }
        button, select, input { font-family: inherit; font-size: 12px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text-main); outline: none; }
        button { cursor: pointer; background: var(--btn-bg); color: var(--btn-text); border: none; font-weight: 600; transition: opacity 0.15s; }
        button:hover { opacity: 0.9; }
        button.secondary { background: var(--surface); color: var(--text-main); border: 1px solid var(--border); }
        button.danger { background: var(--red-btn); color: white; border-radius: 3px; padding: 4px 8px; font-weight: bold; }
        button.ai-scan { background: var(--ai-btn); color: white; padding: 10px; width: 100%; font-size: 14px; margin-bottom: 8px; border-radius: 6px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } 70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
        .api-key-box { width: 100%; margin-bottom: 8px; padding: 8px; border: 1px dashed var(--accent); background: var(--surface); }
        .creator-area { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; margin-bottom: 8px; background: var(--surface); padding: 8px; border: 1px solid var(--border); border-radius: 6px; }
        .creator-area button.add-btn { grid-column: 1 / -1; padding: 8px; font-size: 13px; }
        .table-container { width: 100%; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); overflow-x: auto; margin-bottom: 8px; }
        .data-table { width: 100%; border-collapse: collapse; text-align: center; }
        .data-table th, .data-table td { border: 1px solid var(--border); padding: 4px; }
        .data-table th { background: var(--header-bg); color: var(--header-text); font-weight: 600; font-size: 11px; }
        .data-table td input, .data-table td select { width: 100%; border: 1px solid transparent; background: transparent; text-align: center; padding: 4px; color: var(--text-main); border-radius: 2px; }
        .data-table td input:focus, .data-table td select:focus { background: rgba(59, 130, 246, 0.15); border-color: var(--btn-bg); outline: none; }
        .category-row td { background: var(--cat-bg); color: var(--cat-text); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 6px 8px; text-align: left; }
        .col-del { width: 35px; } .col-unit { width: 75px; } .col-w, .col-h, .col-qty { width: 28%; }
        .results-wrapper { background: var(--surface); border: 1px solid var(--border); padding: 12px; border-radius: 6px; display: none; }
        .global-summary { background: var(--summary-bg); color: #f8fafc; padding: 14px; border-radius: 6px; margin-bottom: 16px; border: 1px solid var(--border); }
        .global-summary h2 { margin: 0 0 12px 0; font-size: 15px; text-align: center; border-bottom: 1px solid #334155; padding-bottom: 8px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
        .summary-color-block { background: var(--summary-card); border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-bottom: 10px; }
        .summary-color-title { font-size: 13px; font-weight: 700; color: var(--cat-text); margin-bottom: 8px; border-bottom: 1px dashed var(--border); padding-bottom: 4px; text-transform: uppercase; }
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 11px; }
        .summary-box { background: rgba(0,0,0,0.25); padding: 8px; border-radius: 4px; border-left: 3px solid var(--btn-bg); }
        .summary-box.handle-box { border-left-color: var(--handle); }
        .summary-box div.box-head { font-weight: 700; margin-bottom: 4px; color: var(--text-main); font-size: 11px; }
        .summary-box span { display: block; font-size: 14px; font-weight: 700; margin-top: 2px; color: #f8fafc; }
        .summary-box .waste-val { color: var(--waste); }
        .section-title { font-size: 13px; color: var(--text-main); border-bottom: 2px solid var(--border); padding-bottom: 4px; margin: 16px 0 10px 0; font-weight: 700; text-transform: uppercase; }
        .group-result { margin-bottom: 14px; }
        .group-title { color: var(--cat-text); font-weight: 700; font-size: 12px; margin-bottom: 6px; }
        .bar-wrap { margin-bottom: 8px; }
        .bar-label { font-size: 10px; margin-bottom: 3px; color: var(--text-muted); }
        .bar-frame { width: 100%; background: rgba(0,0,0,0.3); border-radius: 3px; padding: 2px; border: 1px solid var(--border); }
        .bar-bg { display: flex; height: 22px; background: var(--waste); width: 100%; border-radius: 2px; overflow: hidden; }
        .bar-seg { height: 100%; border-right: 1px solid #000; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #000; white-space: nowrap; overflow: hidden; padding: 0 2px; }
        .seg-p { background: var(--profile); } .seg-h { background: var(--handle); }
        #ai-loader { display: none; text-align: center; font-weight: bold; color: var(--accent); margin-bottom: 10px; font-size: 14px; padding: 10px; border: 1px solid var(--accent); border-radius: 6px; background: rgba(245, 158, 11, 0.1); }
    </style>
</head>
<body class="dark-mode">

<div class="header-bar">
    <div class="controls">
        <button class="secondary" onclick="toggleTheme()" id="btn-theme">☀️ Light</button>
    </div>
    <h1 id="title-text">JAY AMBE PROFILE</h1>
    <div class="controls">
        <label style="font-size: 10px; color: var(--text-muted);">Unit:</label>
        <select id="global-unit" onchange="syncGlobalUnit(); calculate();">
            <option value="MM">MM</option>
            <option value="INCH">INCH</option>
            <option value="FT">FT</option>
        </select>
    </div>
</div>

<input type="password" id="gemini-api-key" class="api-key-box" placeholder="🔒 Paste Google API Key Here" onchange="saveKey()">

<button class="ai-scan" onclick="document.getElementById('camera-input').click()">📸 Scan Photo (Auto Extract AI)</button>
<input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;" onchange="handleImageScan(event)">

<div id="ai-loader">🤖 Uploading Photo...</div>

<div class="creator-area">
    <div>
        <label style="font-size: 9px; color: var(--text-muted); display: block;">PROFILE SPEC</label>
        <select id="inp-size" onchange="updateHandles()">
            <option value="45MM">45MM Profile</option>
            <option value="20MM">20MM Profile</option>
        </select>
    </div>
    <div>
        <label style="font-size: 9px; color: var(--text-muted); display: block;">COLOR / FINISH</label>
        <select id="inp-color">
            <option value="ANODISE">ANODISE</option>
            <option value="IRON GREY">IRON GREY</option>
            <option value="ROSE GOLD">ROSE GOLD</option>
            <option value="MATT BLACK">MATT BLACK</option>
            <option value="MATT GREY">MATT GREY</option>
            <option value="SS BRUSH">SS BRUSH</option>
            <option value="CP BRUSH">CP BRUSH</option>
            <option value="CHROME">CHROME</option>
            <option value="GOLD GLOSSY">GOLD GLOSSY</option>
            <option value="GOLD BRUSH">GOLD BRUSH</option>
        </select>
    </div>
    <div>
        <label style="font-size: 9px; color: var(--text-muted); display: block;">HANDLE SPEC</label>
        <select id="inp-handle">
            <!-- Dynamic -->
        </select>
    </div>
    <button onclick="addCategoryWithRow()" id="btn-add-cat" class="add-btn">Add Merged Row (+ Size Row)</button>
</div>

<div class="table-container">
    <table class="data-table">
        <thead>
            <tr>
                <th class="col-del">X</th>
                <th class="col-w" id="th-w">W</th>
                <th class="col-h" id="th-h">H</th>
                <th class="col-unit" id="th-unit">UNIT</th>
                <th class="col-qty" id="th-qty">QTY</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>
    <button class="secondary" style="width: 100%; border: none; border-top: 1px solid var(--border); border-radius: 0; padding: 8px; font-weight: bold;" onclick="addDataRow()" id="btn-add-row">+ Add Size Row</button>
</div>

<div class="results-wrapper" id="results"></div>

<script>
    window.onload = function() {
        const savedKey = localStorage.getItem('geminiApiKey');
        if (savedKey) document.getElementById('gemini-api-key').value = savedKey;
    };
    function saveKey() {
        localStorage.setItem('geminiApiKey', document.getElementById('gemini-api-key').value.trim());
    }

    const STOCK_MM = 2950;
    const CUT_MARGIN = 10;
    const MM_TO_FT = 304.8;
    const handles45 = ["JMB-02 C HANDLE", "JMB-34 BINDI HANDLE", "JMB-33 G HANDLE", "JMB-35 J HANDLE", "NO HANDLE"];
    const handles20 = ["JMB-07 BINDI HANDLE", "NO HANDLE"];

    function updateHandles() {
        const size = document.getElementById('inp-size').value;
        const handleSelect = document.getElementById('inp-handle');
        handleSelect.innerHTML = '';
        const opts = size === '45MM' ? handles45 : handles20;
        opts.forEach(opt => {
            const el = document.createElement('option'); el.value = opt; el.innerText = opt;
            handleSelect.appendChild(el);
        });
    }
    updateHandles();

    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        document.body.classList.toggle('dark-mode');
    }

    function addCategoryWithRow() {
        const size = document.getElementById('inp-size').value;
        const color = document.getElementById('inp-color').value;
        const handle = document.getElementById('inp-handle').value;
        const tb = document.getElementById('table-body');
        
        const tr = document.createElement('tr');
        tr.className = "category-row";
        tr.dataset.size = size; tr.dataset.color = color; tr.dataset.handle = handle;
        tr.innerHTML = `
            <td><button class="danger" onclick="this.parentElement.parentElement.remove(); calculate();">×</button></td>
            <td colspan="4">${size} | ${color} | ${handle}</td>
        `;
        tb.appendChild(tr);
        addDataRow();
        calculate();
    }

    function syncGlobalUnit() {
        const gUnit = document.getElementById('global-unit').value;
        document.querySelectorAll('.unit-select').forEach(sel => sel.value = gUnit);
    }

    function addDataRow() {
        const tb = document.getElementById('table-body');
        const gUnit = document.getElementById('global-unit').value;
        const tr = document.createElement('tr');
        tr.className = "data-row";
        tr.innerHTML = `
            <td><button class="danger" onclick="this.parentElement.parentElement.remove(); calculate();">×</button></td>
            <td><input type="number" class="w-val grid-cell" step="any" placeholder="0"></td>
            <td><input type="number" class="h-val grid-cell" step="any" placeholder="0"></td>
            <td>
                <select class="unit-select grid-cell">
                    <option value="MM" ${gUnit==='MM'?'selected':''}>MM</option>
                    <option value="INCH" ${gUnit==='INCH'?'selected':''}>INCH</option>
                    <option value="FT" ${gUnit==='FT'?'selected':''}>FT</option>
                </select>
            </td>
            <td><input type="number" class="qty-val grid-cell" value="1" min="1"></td>
        `;
        tb.appendChild(tr);
    }

    document.getElementById('table-body').addEventListener('input', function(e) { if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') calculate(); });

    addCategoryWithRow();

    // ==========================================
    // UPDATED BULLETPROOF AI SCANNER
    // ==========================================
    async function handleImageScan(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        const apiKey = document.getElementById('gemini-api-key').value.trim();
        if (!apiKey) { 
            alert("⚠️ Please paste your API Key first."); 
            return; 
        }

        const loader = document.getElementById('ai-loader');
        loader.style.display = 'block';
        loader.innerText = "🤖 Compressing heavy photo... please wait.";

        try {
            const compressedBase64 = await compressImage(file);
            
            loader.innerText = "🤖 Reading text with AI... (Takes 3-5 seconds)";

            const prompt = `
            Analyze this image of a handwritten or printed quote/shutter measurement.
            Rules:
            1. Ignore Customer Name, Quote number (like 715), and glass type (like CLR).
            2. Identify Profile Color. Translate abbreviations: "MB" = "MATT BLACK", "RG" = "ROSE GOLD", "IG" = "IRON GREY". Defaults to "MATT BLACK" if unsure.
            3. Identify Handle Type. Translate abbreviations: "34" = "JMB-34 BINDI HANDLE", "33" = "JMB-33 G HANDLE", "02" = "JMB-02 C HANDLE". Defaults to "NO HANDLE" if unsure.
            4. Extract Dimensions. If you see "2000*450", treat the larger number as Height (H) and smaller as Width (W). The handle is usually placed on the Height.
            5. Output strictly as a JSON array of objects.
            Format: [{"w": 450, "h": 2000, "qty": 1, "unit": "MM", "color": "MATT BLACK", "handle": "JMB-34 BINDI HANDLE", "size": "45MM"}]
            `;

            // NEW FIX: Changed model to gemini-2.5-flash as 1.5 is shut down
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: prompt },
                            { inlineData: { mimeType: "image/jpeg", data: compressedBase64 } }
                        ]
                    }],
                    generationConfig: { responseMimeType: "application/json" }
                })
            });

            const data = await response.json();
            
            if (data.error) { throw new Error(data.error.message); }

            let aiText = data.candidates[0].content.parts[0].text;
            const parsedData = JSON.parse(aiText);
            
            parsedData.forEach(item => {
                document.getElementById('inp-size').value = item.size || '45MM';
                updateHandles();
                
                const colorSelect = document.getElementById('inp-color');
                if([...colorSelect.options].some(o => o.value === item.color)) { colorSelect.value = item.color; }
                
                const handleSelect = document.getElementById('inp-handle');
                if([...handleSelect.options].some(o => o.value === item.handle)) { handleSelect.value = item.handle; }

                addCategoryWithRow();
                
                const tbody = document.getElementById('table-body');
                const rows = tbody.querySelectorAll('.data-row');
                const lastRow = rows[rows.length - 1];
                
                lastRow.querySelector('.w-val').value = item.w || 0;
                lastRow.querySelector('.h-val').value = item.h || 0;
                lastRow.querySelector('.qty-val').value = item.qty || 1;
                lastRow.querySelector('.unit-select').value = item.unit || 'MM';
            });
            
            calculate();
            loader.innerText = "✅ Done! Calculations Updated.";
            setTimeout(() => { loader.style.display = 'none'; }, 2000);
            
        } catch (err) {
            alert("Error: " + err.message);
            console.error(err);
            loader.style.display = 'none';
        } finally {
            event.target.value = ''; // Reset camera
        }
    }

    function compressImage(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1000; const MAX_HEIGHT = 1000;
                    let width = img.width; let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    resolve(dataUrl.split(',')[1]);
                };
                img.onerror = error => reject(error);
            };
            reader.onerror = error => reject(error);
        });
    }

    function convertToMM(val, unit) {
        if (unit === 'INCH') return val * 25.4;
        if (unit === 'FT') return val * 304.8;
        return val;
    }

    function calculate() {
        const rows = document.getElementById('table-body').children;
        const profilePools = {}; const handlePools = {};  
        let currentSize = null, currentColor = null, currentHandle = null, hasData = false;

        for (let i = 0; i < rows.length; i++) {
            const row = rows[i];
            
            if (row.classList.contains('category-row')) {
                currentSize = row.dataset.size; currentColor = row.dataset.color; currentHandle = row.dataset.handle;
                const pKey = `${currentSize} | ${currentColor}`;
                const hKey = `${currentSize} | ${currentColor} | ${currentHandle}`;
                if (!profilePools[pKey]) profilePools[pKey] = [];
                if (currentHandle !== "NO HANDLE" && !handlePools[hKey]) handlePools[hKey] = [];
            } else if (row.classList.contains('data-row') && currentSize) {
                const wRaw = parseFloat(row.querySelector('.w-val').value) || 0;
                const hRaw = parseFloat(row.querySelector('.h-val').value) || 0;
                const unit = row.querySelector('.unit-select').value;
                const qty = parseInt(row.querySelector('.qty-val').value) || 0;

                if (wRaw > 0 && hRaw > 0 && qty > 0) {
                    hasData = true;
                    const w_mm = convertToMM(wRaw, unit); const h_mm = convertToMM(hRaw, unit);
                    const pKey = `${currentSize} | ${currentColor}`;
                    const hKey = `${currentSize} | ${currentColor} | ${currentHandle}`;
                    const hasHandle = currentHandle !== "NO HANDLE";

                    for (let q = 0; q < qty; q++) {
                        profilePools[pKey].push({ display: `${wRaw} ${unit}`, cut: w_mm + CUT_MARGIN });
                        profilePools[pKey].push({ display: `${wRaw} ${unit}`, cut: w_mm + CUT_MARGIN });
                        if (hasHandle) {
                            profilePools[pKey].push({ display: `${hRaw} ${unit}`, cut: h_mm + CUT_MARGIN });
                            handlePools[hKey].push({ display: `${hRaw} ${unit}`, cut: h_mm + CUT_MARGIN });
                        } else {
                            profilePools[pKey].push({ display: `${hRaw} ${unit}`, cut: h_mm + CUT_MARGIN });
                            profilePools[pKey].push({ display: `${hRaw} ${unit}`, cut: h_mm + CUT_MARGIN });
                        }
                    }
                }
            }
        }
        renderResults(profilePools, handlePools, hasData);
    }

    function pack(items) {
        items.sort((a, b) => b.cut - a.cut);
        const bins = [];
        for (let item of items) {
            let placed = false;
            for (let bin of bins) {
                if (bin.used + item.cut <= STOCK_MM) {
                    bin.items.push(item); bin.used += item.cut; placed = true; break;
                }
            }
            if (!placed) bins.push({ items: [item], used: item.cut });
        }
        return bins;
    }

    function renderResults(profilePools, handlePools, hasData) {
        const resDiv = document.getElementById('results');
        if (!hasData) { resDiv.style.display = "none"; resDiv.innerHTML = ""; return; }
        
        resDiv.style.display = "block";
        const colorSummaries = {}; let pRenderHTML = ""; let hRenderHTML = ""; let limitExceeded = false;

        for (const pKey in profilePools) {
            const items = profilePools[pKey];
            if (items.length === 0) continue;
            if (items.some(p => p.cut > STOCK_MM)) { limitExceeded = true; continue; }
            const bins = pack(items);
            if (!colorSummaries[pKey]) colorSummaries[pKey] = { pSticks: 0, pUsedMm: 0, pWasteMm: 0, handles: {} };
            colorSummaries[pKey].pSticks = bins.length;
            pRenderHTML += `<div class="group-result"><div class="group-title">▶ ${pKey} (Total Sticks: ${bins.length})</div>`;
            bins.forEach((bin, idx) => {
                colorSummaries[pKey].pUsedMm += bin.used;
                const waste = STOCK_MM - bin.used; colorSummaries[pKey].pWasteMm += waste;
                const usedFt = (bin.used / MM_TO_FT).toFixed(2); const wasteFt = (waste / MM_TO_FT).toFixed(2);
                pRenderHTML += `<div class="bar-wrap"><div class="bar-label">Stick ${idx+1} | Utilized: ${usedFt} ft | Offcut: <span style="color:var(--waste)">${wasteFt} ft</span></div><div class="bar-frame"><div class="bar-bg" title="Utilized: ${usedFt} ft | Offcut: ${wasteFt} ft">`;
                bin.items.forEach(item => {
                    const pct = (item.cut / STOCK_MM) * 100;
                    pRenderHTML += `<div class="bar-seg seg-p" style="width: ${pct}%;" title="Size: ${item.display}">${item.display}</div>`;
                });
                pRenderHTML += `</div></div></div>`;
            });
            pRenderHTML += `</div>`;
        }

        for (const hKey in handlePools) {
            const items = handlePools[hKey];
            if (items.length === 0) continue;
            if (items.some(h => h.cut > STOCK_MM)) { limitExceeded = true; continue; }
            const bins = pack(items);
            const parts = hKey.split(' | '); const pKey = `${parts[0]} | ${parts[1]}`; const handleName = parts[2];
            if (!colorSummaries[pKey]) colorSummaries[pKey] = { pSticks: 0, pUsedMm: 0, pWasteMm: 0, handles: {} };
            let hUsedMm = 0, hWasteMm = 0;
            bins.forEach(b => { hUsedMm += b.used; hWasteMm += (STOCK_MM - b.used); });
            colorSummaries[pKey].handles[handleName] = { hSticks: bins.length, hUsedMm, hWasteMm };
            hRenderHTML += `<div class="group-result"><div class="group-title">▶ ${hKey} (Total Sticks: ${bins.length})</div>`;
            bins.forEach((bin, idx) => {
                const usedFt = (bin.used / MM_TO_FT).toFixed(2); const wasteFt = ((STOCK_MM - bin.used) / MM_TO_FT).toFixed(2);
                hRenderHTML += `<div class="bar-wrap"><div class="bar-label">Stick ${idx+1} | Utilized: ${usedFt} ft | Offcut: <span style="color:var(--waste)">${wasteFt} ft</span></div><div class="bar-frame"><div class="bar-bg" title="Utilized: ${usedFt} ft | Offcut: ${wasteFt} ft">`;
                bin.items.forEach(item => {
                    const pct = (item.cut / STOCK_MM) * 100;
                    hRenderHTML += `<div class="bar-seg seg-h" style="width: ${pct}%;" title="Size: ${item.display}">${item.display}</div>`;
                });
                hRenderHTML += `</div></div></div>`;
            });
            hRenderHTML += `</div>`;
        }

        if (limitExceeded) alert("Warning: Sizes over 2950mm omitted.");

        let sumHTML = `<div class="global-summary"><h2>TOTAL STOCK SUMMARY</h2>`;
        for (const colKey in colorSummaries) {
            const data = colorSummaries[colKey];
            sumHTML += `<div class="summary-color-block"><div class="summary-color-title">📌 ${colKey}</div><div class="summary-grid"><div class="summary-box"><div class="box-head">PROFILE SUMMARY</div>Total Sticks: <span>${data.pSticks}</span>Utilized: <span>${(data.pUsedMm / MM_TO_FT).toFixed(2)} ft</span>Offcut: <span class="waste-val">${(data.pWasteMm / MM_TO_FT).toFixed(2)} ft</span></div>`;
            const handleKeys = Object.keys(data.handles);
            if (handleKeys.length > 0) {
                handleKeys.forEach(hName => {
                    const hData = data.handles[hName];
                    sumHTML += `<div class="summary-box handle-box"><div class="box-head">HANDLE: ${hName}</div>Total Sticks: <span>${hData.hSticks}</span>Utilized: <span>${(hData.hUsedMm / MM_TO_FT).toFixed(2)} ft</span>Offcut: <span class="waste-val">${(hData.hWasteMm / MM_TO_FT).toFixed(2)} ft</span></div>`;
                });
            } else {
                sumHTML += `<div class="summary-box handle-box" style="opacity: 0.6;"><div class="box-head">HANDLE SUMMARY</div><span>No Handles</span></div>`;
            }
            sumHTML += `</div></div>`;
        }
        sumHTML += `</div>`;

        let finalHTML = sumHTML;
        if (pRenderHTML) finalHTML += `<div class="section-title">PROFILE CUTTING SCHEME</div>` + pRenderHTML;
        if (hRenderHTML) finalHTML += `<div class="section-title">HANDLE CUTTING SCHEME</div>` + hRenderHTML;
        resDiv.innerHTML = finalHTML;
    }
</script>
</body>
</html>
